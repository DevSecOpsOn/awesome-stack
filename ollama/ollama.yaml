
services:
  
  server:
    image: ollama/ollama
    labels:
      - sablier.enable=false
    deploy:
      labels:
        - sablier.enable=false
        - sablier.group=ai
        - traefik.enable=true
        - traefik.swarm.lbswarm=false
        - traefik.swarm.network=swarm2swarm
        - traefik.http.routers.ollama.entrypoints=web,websecure
        - traefik.http.routers.ollama.rule=Host(`ollama.docker.local`)
        - traefik.http.services.ollama.loadbalancer.server.port=11434
        - traefik.consulcatalog.connect=true
      replicas: 0 # 1 in case we want to run it as a container 
      mode: replicated
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 20G # https://ollama.com/blog/gpu-acceleration
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    environment:
      SERVICE_NAME: "ollama"
      SERVICE_TAGS: "automation,workflow,nocode,ai"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment ports if you want to access ollama directly
    # ports:
    #   - 11434:11434
    networks:
      - swarm2swarm
      - compose2swarm

volumes:
  ollama_data:
    driver: local

networks:
  compose2swarm:
    external: true
  swarm2swarm:
    external: true
