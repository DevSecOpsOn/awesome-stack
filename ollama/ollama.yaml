
services:
  
  server:
    image: ollama/ollama
    labels:
      - sablier.enable=true
      - sablier.group=ai
    deploy:
      labels:
        - traefik.enable=false
        - traefik.swarm.lbswarm=false
        - traefik.swarm.network=swarm2swarm
        - traefik.http.routers.ollama.entrypoints=web,websecure
        - traefik.http.routers.ollama.rule=Host(`ollama.docker.local`)
        - traefik.http.services.ollama.loadbalancer.server.port=11434
        - traefik.consulcatalog.connect=true
      mode: replicated
      replicas: 1
      endpoint_mode: vip
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      restart_policy:
        condition: any
        delay: 5s
        window: 120s
      resources:
        limits:
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "200k"
        max-file: "10"
    environment:
      SERVICE_NAME: "ollama"
      SERVICE_TAGS: "automation,workflow,nocode,ai"
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - 11434:11434
    networks:
      - swarm2swarm
      - compose2swarm

volumes:
  ollama_data:
    driver: local

networks:
  compose2swarm:
    external: true
  swarm2swarm:
    external: true
