<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>LinkedIn Recruiter Optimization Engine - Dual Arch</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
    <nav class="border-b border-slate-800 bg-slate-900/50 h-16 flex items-center justify-between px-8">
        <span class="font-bold text-xl text-blue-400">🤖 LinkedIn Recruiter Agent (Dual Engine)</span>
    </nav>
    <main class="max-w-4xl mx-auto px-4 py-8">
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-6 shadow-xl mb-8">
            <h2 class="text-lg font-semibold text-slate-200 mb-4">🚀 Run Dynamic Alignment Sweep</h2>
            <form id="matchForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div class="md:col-span-2">
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Target Job Description URL</label>
                        <input type="url" id="jobUrl" required placeholder="https://boards.greenhouse.io/company/jobs/12345" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-400 mb-1.5">Orchestrator Engine Core</label>
                        <select id="aiProvider" class="w-full bg-slate-900 border border-slate-800 rounded-lg px-4 py-2 text-slate-200 focus:outline-none focus:border-blue-500 transition">
                            <option value="gemini">Gemini 2.5 Flash (Native SDK)</option>
                            <option value="anthropic">Claude 3.5 Sonnet (Anthropic)</option>
                            <option value="kimi">Kimi AI (Moonshot Core)</option>
                            <option value="openai">GPT-4o Mini (OpenAI)</option>
                            <option value="ollama">Ollama (Local Open-Source)</option>
                        </select>
                    </div>
                </div>
                <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 font-medium py-2.5 rounded-lg transition">Analyze & Generate Strategy</button>
            </form>
        </div>
        <div id="resultsPanel" class="hidden bg-slate-950 border border-slate-800 rounded-xl p-6">
            <h3 class="text-xl font-bold mb-4">Results Dashboard</h3>
            <p>Processing complete. Data committed to persistent records.</p>
        </div>
    </main>
    <script>
        document.getElementById('matchForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const jobUrl = document.getElementById('jobUrl').value;
            const provider = document.getElementById('aiProvider').value;
            alert(`Triggering analysis via matching endpoint using provider: ${provider}`);
        });
    </script>
</body>
</html>
