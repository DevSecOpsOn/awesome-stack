name: linkedin_agent

services:
  linkedin-agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: linkedin_agent_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgres://root:${DOCKER_SECRET_DB}@db_postgres:5432/linkedin?sslmode=disable
      - OLLAMA_URL=http://127.0.0.1:11434/api/chat
      - OLLAMA_MODEL=nemotron-3-nano:30b
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # depends_on:
    #   ollama-bootstrap:
    #     condition: service_completed_successfully
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - compose2swarm

  # Uncomment if you don't have already an ollama instance on your swarm
  # ollama-service:
