  #   container_name: ollama_service
  #   restart: unless-stopped
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - ollama_model_data:/root/.ollama
  #   networks:
  #     - compose2swarm

  # ollama-bootstrap:
  #   image: curlimages/curl:latest
  #   container_name: ollama_bootstrap
  #   depends_on:
  #     - ollama_server
  #   volumes:
  #     - ollama_model_data:/root/.ollama
  #   entrypoint: [ "/bin/sh", "-c" ]
  #   command:
  #     - |
  #       echo "⏳ Waiting for local Ollama engine initialization hooks..."
  #       until curl -s http://ollama_server:11434/api/tags > /dev/null; do
  #         sleep 3
  #       done
  #       echo "✅ Ollama service container online. Triggering automatic nemotron-3-nano:30b download..."
  #       curl -X POST http://ollama_server:11434/api/pull -d '{"name": "nemotron-3-nano:30b"}'
  #       echo "🚀 Model layer pulling loop complete. Disengaging bootstrap container lifecycle."
  #   networks:
  #     - compose2swarm

volumes:
  ollama_model_data:
    name: ollama_model_data

networks:
  compose2swarm:
    external: true
